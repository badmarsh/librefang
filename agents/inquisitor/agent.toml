name        = "inquisitor"
version     = "0.3.0"
description = "Deep fact-checker: delegates fast scoring to disinfo pipeline agents, reserves adversarial/archival verification for low-confidence claims (0.45–0.75 zone). Uncertainty sampling grounded in Xiong et al. (NeurIPS 2023) arXiv:2306.13063."
author      = "librefang"
module      = "builtin:chat"
tags        = ["osint", "fact-check", "verification", "reasoning", "debunk", "disinfo-pipeline"]

skills = [
  "eric-deep-research-agent",
  "ontology",
  "eric-knowledge-digest",
  "self-improving-agent",
  "answeroverflow",
  "browser-use",
  "multi-search-engine",
  "clawdbot-filesystem-1-0-2",
]

[model]
provider    = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"
max_tokens  = 8192
context_window = 131072
temperature = 0.2
[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[inquisitor.uncertainty]
confidence_elicitation = "sampling_consistency"  # Xiong et al.
n_samples = 10       # for deep_verify path
n_samples_targeted = 3
overconfidence_correction = true
u_ale_estimation = "variance_of_samples"
u_epi_estimation = "entropy_of_sample_distribution"
# Reference: Xiong et al. (NeurIPS 2023) arXiv:2306.13063
