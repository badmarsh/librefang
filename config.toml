# OpenFang runtime configuration
schema_version = "2"

api_listen      = "127.0.0.1:4200"
cors_origin     = "http://localhost:4200"
security_headers = true

[provider_urls]
qwen      = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
qwen-code = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"

[default_model]
api_key_env = "DASHSCOPE_API_KEY"
model       = "qwen-plus-2025-07-28"
provider    = "qwen"

[memory]
decay_rate = 0.05

[network]
listen_addr = "127.0.0.1:4200"

[knowledge_graph]
enabled = true
backend = "sqlite"
path    = "/home/ubuntu/.openfang/knowledge-graph.db"

[output]
dir = "/tmp/openfang"

[monitoring]
prometheus_port  = 9100
healthcheck_path = "/health"

# ── Web search providers ───────────────────────────────────────────────────────
# Primary: Brave Search.  Fallback: Tavily (used automatically when Brave quota
# is exhausted or BRAVE_API_KEY is absent).
[web]
search_provider          = "brave"
search_fallback_provider = "tavily"

[web.brave]
api_key_env = "BRAVE_API_KEY"

[web.tavily]
api_key_env = "TAVILY_API_KEY"

# ── Per-agent tunables ─────────────────────────────────────────────────────────
[watchdog]
# Escalation score threshold (0.0–1.0). Claims scoring >= this value are
# forwarded to claim-extractor. Tune without editing the agent system prompt.
escalation_threshold = 0.72

# ── Improvement 1: Bayesian Weight Adaptation ─────────────────────────────────
# arXiv:2310.01555 — Dynamic Ensemble Weighting for LLM Fact-Checking
[disinfo_pipeline]
weight_adaptation_enabled   = true
weight_recompute_interval   = 50        # verdicts before recompute
weight_deviation_threshold  = 0.08      # trigger recompute if any agent drifts > 8%
# Baseline weights (4-agent ensemble) — 5th signal (source-rater) added below
baseline_weights            = {ml = 0.26, wiki = 0.22, trip = 0.24, coh = 0.16, src = 0.12}

# ── Improvement 2: Semantic Claim Deduplication ────────────────────────────────
# arXiv:2305.14325 — SBERT Semantic Deduplication
[claim_extractor]
semantic_dedup_enabled      = true
semantic_dedup_window_hours = 72
semantic_dedup_threshold    = 0.88
embedding_model             = "text-embedding-v3"
# Slovak NER flags (Improvement 7)
slovak_ner_mode                   = true
entity_translation_flag_threshold = 3     # Levenshtein distance threshold
preserve_original_entities        = true

# ── Improvement 4: CIB Detector ───────────────────────────────────────────────
# arXiv:2302.07934 — Coordinated Inauthentic Behaviour detection
[cib_detector]
temporal_window_hours     = 2
lexical_overlap_threshold = 0.65
cib_escalation_threshold  = 0.70

# ── Improvement 8: Prompt Injection Shield ────────────────────────────────────
# arXiv:2302.12173 — Prompt injection attack techniques for LLMs
[security]
injection_shield_enabled       = true
injection_quarantine_threshold = 0.80
injection_log_path             = "/tmp/openfang/quarantine.log"

# ── Improvement 10: Writer HITL Confidence-Gated Publication Tiers ────────────
# Pattern from anthropics/anthropic-cookbook HITL; arXiv:2308.08155
[writer]
tier1_confidence_threshold    = 0.90
tier1_epistemic_max           = 0.25
tier2_confidence_min          = 0.70
tier3_auto_publish_on_timeout = false
review_queue_path             = "/tmp/openfang/review_queue.json"
