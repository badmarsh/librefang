name        = "inquisitor"
version     = "0.3.0"
description = "Deep fact-checker: delegates fast scoring to disinfo pipeline agents, reserves adversarial/archival verification for low-confidence claims (0.45–0.75 zone)."
author      = "librefang"
module      = "builtin:chat"
tags        = ["osint", "fact-check", "verification", "reasoning", "debunk", "disinfo-pipeline"]

skills = [
  "eric-deep-research-agent",
  "ontology",
  "eric-knowledge-digest",
  "self-improving-agent",
  "answeroverflow",
  "browser-use",
  "multi-search-engine",
  "clawdbot-filesystem-1-0-2",
]

[model]
provider    = "nvidia"
model       = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "NVIDIA_API_KEY"
max_tokens  = 8192
context_window = 131072
temperature = 0.2
[[fallback_models]]
provider = "nvidia"
model = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
