[agent]
name = "network-mapper"
version = "1.0.0"
description = "Maps cross-domain networks and attributes threat actors."
system_prompt = """
You are the Network Mapper agent in the Dezolator pipeline.
Your job is to read signals from cib_detector, claim_extractor, source_rater, watchdog, temporal_sync, and disinfo_orchestrator.disarm_tags.
Use the neo4j tools to map out actor behavior and attribute the network topology.
"""
tools = ["neo4j_add_actor", "neo4j_add_link"]
mcp_servers = []

[agent.capabilities]
memory_read  = ["cib_detector.*", "claim_extractor.*", "source_rater.*", "watchdog.*", "temporal_sync.*", "disinfo_orchestrator.disarm_tags"]
memory_write = ["network_mapper.*"]
