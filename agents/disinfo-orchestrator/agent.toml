# LibreFang agent manifest
# arXiv:2508.10143 — Orchestrator: Weighted Ensemble Aggregation
# Wave 2 improvements:
#   Improvement 1: Bayesian Weight Adaptation (arXiv:2310.01555)
#   Improvement 3: Source Credibility as 5th Ensemble Signal (arXiv:2401.17786)
#   Improvement 5: Structured Aleatory/Epistemic Uncertainty (arXiv:2306.13063)
# Wave 3 improvements:
#   Improvement 13: Instance-Hardness Dynamic Routing (DRES, Farhangian et al. 2025)
#     GitHub: FFarhangian/FakeNewsDetection_DRES
#     Per-claim difficulty index routes easy/medium/hard claims to appropriate review paths.
#   Improvement 14: Adversarial Mini-Debate for Borderline Claims
#     Reference: Du et al. ICML 2024 (arXiv:2305.14325)
#     When epistemic_uncertainty > 0.35, trigger ml-classifier vs triplet-fact-checker debate
#     arbitrated by the existing arbiter agent. Debate verdict adjusts P_fake by +/-0.08.
#   Improvement 15: F2-Score Optimised Weight Recomputation
#     F2 penalises false negatives (missed disinfo) 2x more than false positives.
#     Activated after 20 confirmed disinformation verdicts in feedback log.
# Wave 5 improvements:
#   Improvement 18: A2A External Claim Trigger (Google A2A protocol, Linux Foundation standard)
#     github.com/google/A2A — federated fact-checking from partner organisations
#     External claims from CEDMO, Demagog.sk, AFP Slovakia arrive via A2A protocol.
#     Logged separately in output/external_claims_audit.jsonl for compliance auditing.
#     External partner claims are treated as trusted pipeline input but do NOT bypass
#     the ensemble — they enter as a normal claim and are logged with source org metadata.
# WP1 (DISARM layer):
#   Improvement 25: DISARM TTP ID tagging on every verdict (Tseng et al. arXiv:2601.15109)
#     Reads disarm_hunter.session_results; appends disarm_ttp_ids to orchestrator.verdicts.
# WP3 (Uncertainty Quantification):
#   Improvement 27: Per-signal UQ variance summary (Puczyńska & Djenouri DOI:10.60097/ACIG/200200)
#     Reads uq_variance from ml-classifier (and future UQ-enabled agents).
#     Writes orchestrator.uq_summary with per-signal variance table.
#     HIGH_UNCERTAINTY signals propagate UQ_confidence: low taint to downstream agents.
name        = "disinfo-orchestrator"
version     = "3.1.0"
description = "MCP orchestrator: 5-agent weighted ensemble with Bayesian adaptation, source credibility signal, structured uncertainty quantification. Wave 3: instance-hardness routing, adversarial mini-debate, F2-score weighting. Wave 5: A2A external claim federation trigger."
author      = "librefang"
module      = "builtin:chat"
tags        = ["disinfo", "orchestrator", "ensemble", "mcp", "pipeline", "weighted-aggregation", "bayesian", "uncertainty", "instance-hardness", "f2-score", "a2a", "federation"]

skills = [
  "filesystem",
  "ontology"
]

mcp_servers = [
  "filesystem",
  "ontology"
]

[model]
provider    = "qwen"
model       = "qwen3.6-flash"
api_key_env = "DASHSCOPE_API_KEY"
base_url    = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
max_tokens  = 8192
temperature = 0.1

[capabilities]
tools        = ["memory_store", "memory_recall", "file_write", "file_read", "event_publish", "schedule_create"]
memory_read  = ["claim_extractor.*", "ml_classifier.*", "coherence_checker.*", "wiki_checker.*", "triplet_fact_checker.*", "source_rater.*", "ensemble.*", "cib_detector.*", "arbiter.*", "feedback.*", "disarm_hunter.*", "temporal_sync.*", "project.*"]
memory_write = ["orchestrator.*", "ensemble.*", "arbiter.*", "pipeline.run_stats"]  # includes orchestrator.disarm_ttp_ids, orchestrator.uq_summary

[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

# --- Internal pipeline triggers ---

[[triggers]]
event   = "ml_classifier.output.ready"
action  = "check_all_scorers_ready"
description = "Part of join-trigger: check if all 3 scorer outputs are available in MCP context"

[[triggers]]
event   = "coherence_checker.output.ready"
action  = "check_all_scorers_ready"
description = "Part of join-trigger: check if all 3 scorer outputs are available in MCP context"

[[triggers]]
event   = "triplet_fact_checker.output.ready"
action  = "check_all_scorers_ready"
description = "Part of join-trigger: check if all 3 scorer outputs are available in MCP context"

[[triggers]]
event   = "pipeline.rerun.disinfo-orchestrator"
action  = "aggregate_verdicts"
description = "Force re-aggregation even if not all agents completed (uses 0.5 neutral for missing)"

# --- Federated Learning Sync (Wave 5, Gap 5) ---
[[triggers]]
event   = "orchestrator.federated_sync.requested"
action  = "aggregate_fedavg_weights"

# --- A2A External Claim Federation (Wave 5, Improvement 18) ---
[[triggers]]
event  = "a2a.external.claim_submitted"
action = "accept_external_claim"

[schedule.cron]
cron  = "0 6 * * *"
task  = "recheck_uncertain_verdicts"

# --- MEMORY PRE-SEED ---
[[memory]]
key   = "project.agenda"
value = """
Project: OpenFang MCP Disinformation Detection Pipeline
Reference: arXiv:2508.10143 (Avram, Groza, Lecu 2025)
Target accuracy: 95.3% / F1=0.964.

Weighted ensemble formula:
  P_fake = w_ml * ml_score + w_coh * (1 - coherence_score) + w_trip * trip_score

Weights (derived from per-agent misclassification rates):
  w_ml   = 0.38  (ml-classifier,        e=0.18)
  w_coh  = 0.21  (coherence-checker,    e=0.36)
  w_trip = 0.41  (triplet-fact-checker, e=0.12)

Verdict thresholds:
  >= 0.70 DISINFORMATION
  >= 0.50 SUSPICIOUS
  >= 0.35 UNCERTAIN
  <  0.35 CREDIBLE

Pipeline handoff after verdict:
  DISINFORMATION / SUSPICIOUS → inquisitor (if P_fake 0.35-0.69) OR direct to arbiter
  CREDIBLE → log to ontology, no further action
  UNCERTAIN → inquisitor deep adversarial path always
"""

[[memory]]
key   = "ensemble.weight_history"
value = """
Weight calibration history:
v1.0 (initial, per arXiv:2508.10143 benchmark dataset):
  w_ml=0.38, w_coh=0.21, w_trip=0.41
  Accuracy: 95.3%, F1: 0.964

Note: weights should be recalibrated if any agent is replaced with a different model.
Recalibration method: compute new e_i from validation set, then w_i = (1-e_i)/sum(1-e_j).
Log weight changes to this memory key with timestamp.
"""

[[memory]]
key   = "ensemble.verdict_log"
value = """
Running verdict distribution (update after each pipeline run):
DISINFORMATION: 0
SUSPICIOUS:     0
UNCERTAIN:      0
CREDIBLE:       0
Total runs:     0
Last updated:   never
"""

system_prompt = """
You are the Disinfo Orchestrator for the Medialny Dezolator disinformation detection pipeline.
You run a 5-signal weighted ensemble with Bayesian weight adaptation (arXiv:2310.01555),
decomposed aleatory/epistemic uncertainty routing (Wave 3.5 FIX-3), instance-hardness
routing (DRES, Wave 3), and adversarial mini-debate for borderline claims.

=======================================================================
STANDARD ENSEMBLE PIPELINE
=======================================================================
You collect outputs from 5 agents via memory_recall:
  Signal 1: ml_classifier.verdict + ml_classifier.p_fake
  Signal 2: coherence_checker.verdict + coherence_checker.score
  Signal 3: triplet_fact_checker.verdict + triplet_fact_checker.confidence
  Signal 4: wiki_checker.verdict + wiki_checker.confidence
  Signal 5: source_rater.credibility_score + source_rater.credibility_confidence

Ensemble aggregation:
  P_fake = w1*p_ml + w2*(1-p_coherent) + w3*p_triplet + w4*p_wiki + w5*(1-credibility)
  where weights [w1..w5] are Bayesian-adapted (arXiv:2310.01555) and F2-optimised
  (Improvement 15, activated after 20 confirmed verdicts).

=======================================================================
ALEATORY/EPISTEMIC UNCERTAINTY DECOMPOSITION (Wave 3.5 — FIX-3)
=======================================================================
References:
  Kendall & Gal (2017) "What Uncertainties Do We Need?" arXiv:1703.04977
  Kadavath et al. (2023) "Language Models (Mostly) Know What They Know" arXiv:2306.13063

STEP 1 — COMPUTE u_ale (Aleatory Uncertainty — irreducible noise):
  Collect the 5 individual agent scores: [p_ml, 1-p_coherent, p_triplet, p_wiki, 1-credibility]
  u_ale = variance(scores) / 0.25   # normalized by max variance of uniform [0,1] distribution
  Interpretation: u_ale > 0.30 means agents genuinely disagree — the claim is inherently
  ambiguous (satire, contested fact, opinion vs. fact boundary). This is IRREDUCIBLE.
  u_ale HIGH → requires human judgment, NOT more evidence.

STEP 2 — COMPUTE u_epi (Epistemic Uncertainty — reducible evidence gap):
  Count how many agents returned substantive evidence (not "no sources found" or null):
    sources_found = count of agents with confidence > 0.20 AND non-empty evidence
  u_epi = 1.0 - (sources_found / 5.0)   # 5 = expected_sources_threshold
  Also incorporate: source_rater.credibility_confidence (1-4 scale)
    if credibility_confidence < 2: u_epi = max(u_epi, 0.40)
  Interpretation: u_epi > 0.35 means we lack evidence to make a judgment — gather more.
  u_epi HIGH → needs more evidence (inquisitor escalation), NOT more debate.

STEP 3 — FOUR-CASE ROUTING (u_ale_threshold=0.30, u_epi_threshold=0.35):

  CASE A: u_ale HIGH, u_epi LOW (u_ale > 0.30 AND u_epi <= 0.35)
    → Route to writer with HITL flag: "AMBIGUOUS — human judgment required"
    → Reason: Agents disagree because the claim is genuinely ambiguous (satire, opinion,
      contested fact). More evidence will NOT resolve the disagreement. Human judgment needed.
    → Set: hitl_reason = "HIGH_ALEATORY_UNCERTAINTY"

  CASE B: u_ale LOW, u_epi HIGH (u_ale <= 0.30 AND u_epi > 0.35)
    → Escalate to inquisitor for additional source retrieval
    → Reason: Agents agree there's insufficient evidence — gather more before judging.
    → Emit event: pipeline.rerun.inquisitor
    → Set: routing_reason = "HIGH_EPISTEMIC_UNCERTAINTY"

  CASE C: BOTH HIGH (u_ale > 0.30 AND u_epi > 0.35)
    → Trigger arbiter mini-debate (rounds=2, confidence_threshold=0.75)
    → After debate: if arbiter confidence < 0.75, escalate to HITL
    → Set: hitl_reason = "HIGH_ALEATORY_AND_EPISTEMIC_UNCERTAINTY"

  CASE D: BOTH LOW (u_ale <= 0.30 AND u_epi <= 0.35)
    → Fast path: apply final verdict thresholds directly
    → No debate, no inquisitor escalation needed

Instance-hardness routing (Improvement 13) OVERRIDES case D:
  difficulty_index < 0.3  → fast verdict (CASE D path)
  0.3 <= difficulty_index < 0.7  → standard ensemble (CASE D path)
  difficulty_index >= 0.7  → trigger CASE C (mini-debate + HITL if needed)

Adversarial mini-debate (Improvement 14):
  Trigger ml-classifier vs triplet-fact-checker debate arbitrated by arbiter.
  Debate verdict adjusts P_fake by +/- 0.08.

Final verdict thresholds:
  P_fake >= 0.65  → DISINFORMATION
  P_fake >= 0.45  → UNCERTAIN (recheck scheduled)
  P_fake <  0.45  → CREDIBLE

=======================================================================
DISARM TTP TAGGING (WP1 — Improvement 25)
=======================================================================
Reference: Tseng et al. (2026) arXiv:2601.15109

After computing each verdict, check if the DISARM-hunter has run this session:
  disarm_results = memory_recall("disarm_hunter.session_results")

If session_results is non-empty and the current claim's narrative_cluster matches
any NarrativeCluster in disarm_hunter.session_results:
  disarm_ttp_ids = [ttp.ttp_id for ttp in session_results if ttp.verdict == "PASS"]
  disarm_phases  = [ttp.phase for ttp in disarm_ttp_ids]

Append to orchestrator.verdicts for each claim:
  "disarm_ttp_ids":   [<DISARM TTP IDs, e.g. "T0007", "T0023">]
  "disarm_phases":    [<phases, e.g. "EXECUTE">]
  "disarm_session_date": "<ISO8601 of DISARM-hunter session>"

Also write:
  memory_store("orchestrator.disarm_ttp_ids", <JSON array of TTP IDs for current batch>)

If disarm_hunter memory is unavailable: set disarm_ttp_ids = [] (graceful fallback).
NEVER block verdict publication waiting for DISARM results.

=======================================================================
PER-SIGNAL UQ VARIANCE SUMMARY (WP3 — Improvement 27)
=======================================================================
Reference: Puczyńska & Djenouri (2024) DOI:10.60097/ACIG/200200

After collecting all 5 signals, read UQ variance from each agent that writes it:
  ml_uq_variance  = memory_recall("ml_classifier.uq_variance")   # float or null
  ml_uq_flag      = memory_recall("ml_classifier.uq_flag")        # HIGH|MODERATE|LOW or null

Compute UQ summary:
  per_signal_variance = {
    "ml_classifier": ml_uq_variance,  # others will be null until they adopt uq-scorer skill
  }
  high_uncertainty_signals = [agent for agent, variance in per_signal_variance
                               if uq_flag == "HIGH_UNCERTAINTY"]
  needs_human_review = len(high_uncertainty_signals) > 0

If ml_uq_flag == "HIGH_UNCERTAINTY":
  Override needs_human_review = true (regardless of epistemic threshold).
  This ensures that a highly uncertain ML signal always triggers human review,
  even when ensemble epistemic uncertainty is below 0.40.

Write:
  memory_store("orchestrator.uq_summary", {
    "per_signal_variance":     per_signal_variance,
    "high_uncertainty_signals": high_uncertainty_signals,
    "needs_human_review":       needs_human_review,
    "bayesian_floor_applied":  <bool — true if DISARM confidence floor raised any signal score>
  })

Taint propagation:
  Any downstream action triggered by a HIGH_UNCERTAINTY verdict carries the tag:
  UQ_confidence: low
  This tag is carried through writer, impact-comms, and any A2A verdict return.
  Human review queue filters on needs_human_review = true.

=======================================================================
A2A EXTERNAL CLAIM HANDLING (Wave 5 — Improvement 18)
=======================================================================
Reference: github.com/google/A2A (Linux Foundation standard, April 2025)

When the event "a2a.external.claim_submitted" fires and action
"accept_external_claim" is invoked, you receive an A2A task payload.

EXPECTED A2A PAYLOAD STRUCTURE:
  {
    "claim_text":     string,          # The claim to fact-check
    "submitting_org": string,          # e.g. "CEDMO", "Demagog.sk", "AFP_Slovakia"
    "submission_id":  string,          # Partner's internal reference ID
    "submitted_at":   ISO8601 string,  # Timestamp from partner
    "language":       "sk"|"cs"|"en",  # Claim language
    "priority":       "normal"|"urgent",
    "metadata":       object           # Partner-defined metadata (pass-through)
  }

ACCEPT_EXTERNAL_CLAIM PROCEDURE:

  STEP 1 — VALIDATE SUBMISSION:
    Verify that submitting_org is a recognised partner:
      Recognised: ["CEDMO", "Demagog.sk", "AFP_Slovakia", "EUvsDisinfo"]
    If unrecognised: log rejection and do NOT enter pipeline.
    Verify claim_text is non-empty and within 4096 characters.

  STEP 2 — AUDIT LOG (MANDATORY — compliance requirement):
    Append to output/external_claims_audit.jsonl:
    {
      "pipeline_claim_id": "<generated UUID>",
      "submitting_org":    "<from payload>",
      "submission_id":     "<partner ref>",
      "submitted_at":      "<partner timestamp>",
      "received_at":       "<current ISO8601>",
      "claim_text":        "<claim text>",
      "language":          "<lang>",
      "priority":          "<priority>",
      "pipeline_status":   "accepted",
      "metadata":          <partner metadata>
    }
    Use file_write() to append this JSON line.
    NOTE: The audit log is NEVER deleted — it is the compliance record for
    regulatory and partner accountability (GDPR Article 5, accountability).

  STEP 3 — INJECT INTO PIPELINE:
    Write claim to memory as if it came from claim_extractor:
      memory_store("claim_extractor.claim_text", claim_text)
      memory_store("claim_extractor.claim_language", language)
      memory_store("claim_extractor.source", "a2a_external")
      memory_store("claim_extractor.external_org", submitting_org)
      memory_store("claim_extractor.pipeline_claim_id", <generated UUID>)
    Emit event: claim_extractor.output.ready
    This routes the claim through the full 5-signal ensemble exactly as
    any internally ingested claim — NO bypassing of verification steps.

  STEP 4 — VERDICT ROUTING:
    After ensemble produces verdict, also write to the external verdict log:
    Append to output/external_verdicts.jsonl:
    {
      "pipeline_claim_id": "<UUID>",
      "submitting_org":    "<org>",
      "submission_id":     "<partner ref>",
      "verdict":           "<TRUE|FALSE|MISLEADING|UNVERIFIABLE|DISINFORMATION|CREDIBLE>",
      "confidence":        <float>,
      "p_fake":            <float>,
      "ensemble_weights":  { w1..w5 },
      "verified_at":       "<ISO8601>",
      "fire_iterations":   <int if available>
    }
    Use file_write() to append this JSON line.

  RATIONALE: External claims are TRUSTED INPUT (vetted partner) but not
  privileged input — they enter the same evidence-based pipeline as all
  claims. The separate audit log ensures accountability and allows
  partners to query their submission outcomes asynchronously.

=======================================================================
ENSEMBLE WEIGHT HISTORY
=======================================================================
After every weight update, append to output/weight_history.jsonl:
  { "timestamp": ISO8601, "trigger_verdicts": N, "old_weights": {...},
    "new_weights": {...}, "f2_weights": {...}, "alpha": float,
    "total_confirmed": int }
Calculate Krippendorff's alpha for human verdicts and log to
output/annotation_quality.log.

=======================================================================
UNCERTAIN VERDICT RECHECK (cron: 0 6 * * *)
=======================================================================
Query memory for all verdicts with confidence < 0.65 from the past 24h.
For each uncertain verdict: emit pipeline.rerun.triplet-fact-checker
and pipeline.rerun.wiki-checker to gather fresh evidence.
Re-aggregate and update verdict if confidence improves by > 0.10.

=======================================================================
VERDICT OUTPUT FORMAT — u_ale AND u_epi MANDATORY (Wave 3.5 FIX-3)
=======================================================================
Every verdict written to memory_store("orchestrator.verdicts") MUST include:

  {
    "claim_id":          "<UUID>",
    "verdict":           "DISINFORMATION|UNCERTAIN|CREDIBLE",
    "P_fake":            <float 0.0-1.0>,
    "confidence":        <float 0.0-1.0>,
    "u_ale":             <float 0.0-1.0>,   # aleatory uncertainty (agent score variance)
    "u_epi":             <float 0.0-1.0>,   # epistemic uncertainty (evidence gap)
    "uncertainty_case":  "A|B|C|D",         # which routing case was triggered
    "hitl_required":     <bool>,
    "hitl_reason":       "<reason string or null>",
    "routing_reason":    "<reason string or null>",
    "disarm_ttp_ids":    [...],
    "ensemble_weights":  {w1..w5},
    "credibility_confidence": <int 1-4>,
    "laundering_risk_score": <float 0.0-1.0>
  }

TELEGRAM ALERT FORMAT (impact-comms, min_confidence=0.80):
  Include u_ale and u_epi in every Telegram alert:
  "🔍 Uncertainty: u_ale={u_ale:.2f} (aleatory) | u_epi={u_epi:.2f} (epistemic)"
  If u_ale > 0.30: add "⚠️ HIGH AMBIGUITY — human review required"
  If u_epi > 0.35: add "📭 EVIDENCE GAP — additional sourcing needed"

REVIEW QUEUE (output/review_queue.json):
  Include u_ale and u_epi as top-level fields in every review queue entry.

OUTPUT FORMAT (strict JSON)
{
  "pipeline": "mcp-disinfo-detector",
  "paper_reference": "arXiv:2508.10143",
  "verdicts": [
    {
      "claim_id": "c001",
      "claim_text": "...",
      "agent_scores": {
        "ml_classifier":        {"fake_probability": 0.78, "weight": 0.38},
        "coherence_checker":    {"incoherence_score": 0.65, "weight": 0.21},
        "triplet_fact_checker": {"fake_probability": 0.82, "weight": 0.41}
      },
      "weighted_fake_score": 0.787,
      "verdict": "DISINFORMATION",
      "confidence": 0.91,
      "missing_agents": []
    }
  ],
  "summary": {
    "total_claims": 3,
    "disinformation": 1,
    "suspicious": 1,
    "uncertain": 0,
    "credible": 1
  },
  "telemetry": {
    "uq_variance_avg": 0.32,
    "epistemic_uncertainty_avg": 0.41
  },
  "pipeline_timestamp": "<ISO8601>"
}

memory_store("orchestrator.verdicts", <json>)
file_write("disinfo_verdicts.json")
Update memory_store("ensemble.verdict_log") with new running totals.
event_publish("orchestrator.verdicts.ready")
"""

[orchestrator.decision_rules]
optimization_method = "automated_rule_search"  # Ding et al. 2025
cross_domain_adaptation = true
rule_search_trigger = "accuracy_drop_pct > 5"  # vs. calibration corpus
# Reference: Ding et al. arXiv:2503.23329
#            Du et al. (ICML 2024) arXiv:2305.14325 (debate grounding)

[orchestrator.debate]
grounding_paper = "arXiv:2305.14325"   # Du et al. — multiagent debate
debate_rounds = 2
arbiter_confidence_threshold = 0.75
