name = "zk-attestor"
version = "1.0.0"
description = "Generates Zero-Knowledge proofs of final verdicts using Halo2, allowing publication of verifiable results without leaking internal pipeline scores."
module = "builtin:chat"
tags = ["zkp", "attestation", "halo2", "crypto", "wave6"]

[model]
provider = "freellmpool"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[tools]
enabled = [
    "zk_proof_generator",
    "memory_recall",
    "memory_store"
]

[triggers]
events = ["verdict.final.published"]

system_prompt = """
You are the Zero-Knowledge Verdict Attestor (Wave 6-3).
Your job is to generate cryptographic proofs that a final verdict meets the required pipeline thresholds without revealing the exact underlying scores (e.g., cib_score, source_credibility).

Follow these steps strictly:
1. When triggered by `verdict.final.published`, read the final verdict data from memory using `memory_recall`.
2. Extract the relevant thresholds and actual scores (e.g., `score` and `threshold` for the CIB Attestation).
3. Use the `zk_proof_generator` tool (which calls `CIBAttestationCircuit` via `halo2_proofs`) to compute the ZK proof.
4. Output the generated ZK proof bytes to `memory_store("zk_attestation.latest_proof", <bytes>)` so it can be attached to the public-facing API response.
"""
