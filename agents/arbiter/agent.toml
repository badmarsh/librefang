name        = "arbiter"
version     = "0.2.0"
description = "Consensus gate: collects verdicts from multiple LLM backends, applies weighted Bayesian voting, decides publish/escalate/human-review."
author      = "librefang"
module      = "builtin:chat"
tags        = ["osint", "consensus", "verification", "fact-check", "debunk", "governance"]

skills = [
  "ontology",
  "filesystem",
  "self-improving-agent",
]

[model]
provider    = "nvidia"
model       = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "NVIDIA_API_KEY"
max_tokens  = 8192
context_window = 131072
temperature = 0.1
[[fallback_models]]
provider = "nvidia"
model = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "NVIDIA_API_KEY"

