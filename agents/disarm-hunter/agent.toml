# LibreFang agent manifest
# WP1: DISARM/FIMI Domain Ontology Layer
# References:
#   Tseng et al. (2026) arXiv:2601.15109 — Agentic Operationalization of DISARM for FIMI Investigation
#   Tseng et al. (ICWSM 2024 Workshop) — LLM Agent for Disinformation Detection (DISARM + CoT/ReAct)
#   DISARMFoundation/DISARMframeworks v1.5
#
# This agent is the standalone scheduled variant of the DISARM-hunter Hand.
# It runs after the disinfo-orchestrator publishes verdicts and maps them to DISARM TTPs.
# For the full 15-round explore/exploit nightly hunting loop, see hands/disarm-hunter/.
name        = "disarm-hunter"
version     = "1.0.0"
description = "Retrospectively classifies pipeline verdicts and narrative clusters against DISARM v1.5 TTP taxonomy. Applies UCB1 multi-arm bandit explore/exploit over ingested media store. Statistical gate: OR >= 3.0, p < 0.05, n >= 5 before PASS. Adaptation detection: content diversity entropy shift over 30 days."
author      = "librefang"
module      = "builtin:chat"
tags        = ["disarm", "fimi", "ttp", "osint", "hunting", "bandit", "statistical-gate"]

skills      = ["disarm-framework", "ontology", "filesystem"]
mcp_servers = ["filesystem", "ontology"]

[model]
provider    = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"
max_tokens  = 8192
context_window = 131072
temperature = 0.1

[capabilities]
tools        = ["memory_store", "memory_recall", "file_write", "file_read"]
memory_read  = ["orchestrator.verdicts", "cib_detector.*", "watchdog.*", "narrative_tracker.*"]
memory_write = ["disarm_hunter.*"]

[[fallback_models]]
provider    = "gemini"
model       = "gemini-2.5-pro"
api_key_env = "GEMINI_API_KEY"

[[fallback_models]]
provider    = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

# Triggered nightly after orchestrator publishes the day's verdict batch
[[triggers]]
event  = "orchestrator.daily_verdicts_complete"
action = "run_disarm_hunt"

# Also triggered when a narrative cluster reaches CIB_DETECTED status
[[triggers]]
event  = "cib_detector.cib_detected"
action = "classify_cluster_ttps"

[schedule.cron]
cron = "30 2 * * *"
task = "run_disarm_hunt"

[disarm.statistical_gate]
min_odds_ratio       = 3.0
max_p_value          = 0.05
min_supporting_items = 5
bandit_rounds        = 15
bandit_alpha         = 0.3   # EWMA decay for exploitation score update

[disarm.audit]
output_file         = "output/disarm_audit.jsonl"
append_only         = true
include_in_ontology = true
