# LibreFang agent manifest
# arXiv:2508.10143 — Agent 2: Coherence Checker
name = "coherence-checker"
version = "1.0.0"
description = "LLM-based coherence and logical consistency checker for extracted claims"
author = "librefang"
module = "builtin:chat"
tags = ["disinfo", "coherence", "logic", "llm", "pipeline"]

skills = ["filesystem"]

mcp_servers = ["filesystem"]


[model]
provider    = "freellmpool"
model       = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key_env = "FREELLMPOOL_API_KEY"
max_tokens  = 4096
temperature = 0.0
[capabilities]
tools = ["memory_store", "memory_recall", "file_write", "file_read", "http_fetch"]
memory_read = ["claim_extractor.*"]
memory_write = ["coherence_checker.*"]


[[fallback_models]]
provider = "freellmpool"
model = "fast"
api_key_env = "FREELLMPOOL_API_KEY"

[[fallback_models]]
provider = "freellmpool"
model = "nvidia/meta/llama-3.1-8b-instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[[fallback_models]]
provider = "freellmpool"
model = "nvidia/meta/llama-3.3-70b-instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[[triggers]]
event   = "claim_extractor.output.ready"
action  = "check_coherence"

[[triggers]]
event   = "pipeline.rerun.coherence-checker"
action  = "check_coherence"

[[memory]]
key   = "project.agenda"
value = """
Project: OpenFang MCP Disinfo Pipeline
Reference: arXiv:2508.10143
"""

[[memory]]
key   = "coherence.calibration"
value = """
Calibration notes (arXiv:2508.10143 Agent 2)
"""
