name = "browser-hand"
version = "0.1.0"
description = "AI web browser — navigates websites, fills forms, searches products, and completes multi-step web tasks autonomously with safety guardrails"
author = ""
module = "builtin:chat"
priority = "Normal"
profile = "custom"
skills = []
mcp_servers = []
tags = [
    "hand:browser",
    "hand_instance:925d6376-7168-4ca9-a788-c4fd40a380fc",
]
workspace = "/home/ubuntu/.librefang/workspaces/browser-hand"
state_dir = "/home/ubuntu/.librefang/workspaces/browser-hand"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[schedule.continuous]
check_interval_secs = 3600

[model]
provider    = "freellmpool"
model       = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"
max_tokens  = 4096
temperature = 0.3
[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = [
    "browser_navigate",
    "browser_click",
    "browser_type",
    "browser_screenshot",
    "browser_read_page",
    "browser_close",
    "web_search",
    "web_fetch",
    "memory_store",
    "memory_recall",
    "knowledge_add_entity",
    "knowledge_add_relation",
    "knowledge_query",
    "schedule_create",
    "schedule_list",
    "schedule_delete",
    "file_write",
    "file_read",
]
memory_read = []
memory_write = []
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]

[autonomous]
max_iterations = 60
max_restarts = 10
heartbeat_interval_secs = 30


[[fallback_models]]
provider = "freellmpool"
model = "quality"
api_key_env = "FREELLMPOOL_API_KEY"

[[fallback_models]]
provider = "freellmpool"
model = "nvidia/nemotron-3-super-120b-a12b"
api_key_env = "FREELLMPOOL_API_KEY"

[[fallback_models]]
provider = "freellmpool"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"

