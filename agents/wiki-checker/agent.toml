# LibreFang agent manifest
# arXiv:2508.10143 — Agent 2: Wikipedia / Wikidata NER Entity Checker
# Wave 3:
#   Improvement 11: Firecrawl for reliable Wikipedia fetching
#   Improvement 18: Fix calibration weight comment (0.25→0.22)
# Audit long-term fix:
#   Improvement 19: Wikidata SPARQL entity queries
#     The cross-lingual aligner resolves Wikidata Q-IDs per entity.
#     wiki-checker now uses Wikidata SPARQL to query structured facts about Slovak political
#     entities (party membership, positions held, office dates) — dramatically more precise
#     than text-search Wikipedia for SK political entity coverage.
name        = "wiki-checker"
version     = "1.3.0"
description = "Verifies named entities against Wikipedia and Wikidata SPARQL. Wave 3: Firecrawl-backed fetching, corrected weight (0.22). Improvement 19: Wikidata SPARQL for Slovak political entity precision."
author      = "librefang"
module      = "builtin:chat"
tags        = ["disinfo", "wikipedia", "wikidata", "sparql", "ner", "entity-verification", "pipeline", "firecrawl"]

[model]
provider    = "freellmpool"
model       = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"
max_tokens  = 4096
context_window = 32768
temperature = 0.0
[capabilities]
tools        = ["web_fetch", "web_search", "firecrawl_scrape", "memory_store", "memory_recall", "file_write", "file_read"]
memory_read  = ["claim_extractor.*", "cross_lingual_aligner.*"]
memory_write = ["wiki_checker.*"]


[[fallback_models]]
provider = "freellmpool"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[[fallback_models]]
provider = "freellmpool"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[[fallback_models]]
provider = "freellmpool"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[wiki.cross_lingual]
xlmr_model = "xlm-roberta-base"
slavic_ner_backend = "DeepPavlov/bert-base-slavic-ner"
wikidata_languages = ["sk", "cs", "de", "en", "ru", "hu"]
entity_linking_fallback = "exact_string_match"
# Reference: Conneau et al. (ACL 2020) arXiv:1911.02116
#            DeepPavlov/Slavic-BERT-NER github.com/deeppavlov/Slavic-BERT-NER

[meta.references]
papers = [
  "arXiv:1911.02116", 
  "github.com/deeppavlov/Slavic-BERT-NER",
  "arXiv:2203.05115" # Lazaridou et al. (2022) Internet-Augmented Language Models through Few-Shot Prompting
]

[wiki.rag]
internet_augmented_generation = true
# Reference: Lazaridou et al. (2022) arXiv:2203.05115

[citations]
wikidata_sparql = "Vrandečić & Krötzsch 2014 — Wikidata, CACM 57(10)"
foundation      = "arXiv:2508.10143"
