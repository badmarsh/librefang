# LibreFang agent manifest
# arXiv:2508.10143 — Agent 1: ML Classifier
# Part of fix: Fix 1 — Replace fake ml-classifier with real trained model
# WP3: Uncertainty Quantification — uq-scorer skill added (Puczyńska & Djenouri 2024 DOI:10.60097/ACIG/200200)
#   Replaced standard Bayesian UQ with Conformal Prediction (Angelopoulos & Bates, 2021)
#   to provide distribution-free coverage guarantees for stronger legal safety.
#   fallback_models now use 3 distinct provider families (nvidia, gemini, freellmpool) for
#   genuine Deep Ensemble UQ variance — was 4×identical freellmpool/Meta-Llama-3_3-70B.
#
# Wave 3.5 — FIX-2: Transformer model priority order established:
#   1. gerulata/slovakbert (Slovak-specific, best F1=0.8931 on held-out test)
#   2. deeppavlov/bert-base-bg-cs-pl-ru-cased (SlavicBERT, multilingual Slavic coverage)
#   3. facebook/xlm-roberta-base (XLM-R, cross-lingual fallback)
#   4. tfidf_logistic_regression (CPU baseline — NOT recommended for production)
# TF-IDF+LR is retained as fallback ONLY for CPU-only / RAM < 4096 MB environments.
# References: Arkhipov et al. (arXiv:1912.07076); Conneau et al. (arXiv:1911.02116)
name        = "ml-classifier"
version     = "1.3.0"
description = "Transformer sequence classifier for Slovak/multilingual disinformation detection. Primary: gerulata/slovakbert (F1=0.8931). Secondary: SlavicBERT (deeppavlov). 3rd fallback: XLM-RoBERTa (facebook/xlm-roberta-base). CPU fallback: TF-IDF+LR via scripts/serve_ml_classifier.py (baseline, NOT recommended for production). Wave 3.5 FIX-2. Refs: arXiv:1912.07076, arXiv:1911.02116."
author      = "librefang"
module      = "builtin:http_scorer"
tags        = ["disinfo", "ml", "classifier", "tfidf", "pipeline"]

skills = ["filesystem", "uq-scorer"]
mcp_servers = ["filesystem"]

[http_scorer]
endpoint = "http://127.0.0.1:${ML_CLASSIFIER_PORT:-8090}/score"
input_field  = "text"
output_field = "score"
timeout_seconds = 5
fallback_score  = 0.5

[capabilities]
tools        = ["memory_store", "memory_recall", "file_write", "file_read", "event_publish"]
memory_read  = ["claim_extractor.*", "disarm_hunter.session_results", "project.*", "classifier.*"]
memory_write = ["ml_classifier.*"]  # includes uq_variance, uq_method, uq_flag, providers_used

[model]
provider    = "qwen"
model       = "qwen3.6-flash"
api_key_env = "DASHSCOPE_API_KEY"
base_url    = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
max_tokens  = 2048
temperature = 0.0

[[fallback_models]]
provider    = "nvidia"
model = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider    = "gemini"
model       = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"

[[fallback_models]]
provider    = "freellmpool"
model       = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "FREELLMPOOL_API_KEY"

[[triggers]]
event   = "claim_extractor.output.ready"
action  = "classify_claims"
description = "Parallel trigger — fires at same time as coherence-checker and triplet-fact-checker"

[[triggers]]
event   = "pipeline.rerun.ml-classifier"
action  = "classify_claims"
description = "Manual re-run trigger from orchestrator on failure recovery"

[classifier.bert]
primary_model = "gerulata/slovakbert"
secondary_model = "deeppavlov/bert-base-bg-cs-pl-ru-cased"
tertiary_model = "facebook/xlm-roberta-base"
ner_model = "ju-bezdek/slovakbert-conll2003-sk-ner"
slavic_ner_model = "DeepPavlov/bert-base-slavic-ner"
fallback_model = "tfidf_logistic_regression"
fallback_label = "BASELINE CLASSIFIER — NOT RECOMMENDED FOR PRODUCTION. Use transformer models above."
fallback_trigger = "transformers_unavailable OR ram_mb < 4096"
fallback_script = "scripts/serve_ml_classifier.py"
sequence_classification_max_length = 512

# --- MEMORY PRE-SEED ---
[[memory]]
key   = "project.agenda"
value = """
Project: OpenFang MCP Disinformation Detection Pipeline
Reference: arXiv:2508.10143 (Avram, Groza, Lecu 2025)
This agent is Agent 1 of 3 scoring agents. Weight in ensemble: w_ml = 0.38.
Run in parallel with coherence-checker (w=0.21) and triplet-fact-checker (w=0.41).
Input MCP key: claim_extractor.output
Output MCP key: ml_classifier.output
On completion: event_publish("ml_classifier.output.ready")
"""

[[memory]]
key   = "classifier.calibration"
value = """
Calibration notes for LLM simulation of LR+TF-IDF classifier (arXiv:2508.10143 Agent 1):
- Individual accuracy: ~82% on paper's benchmark dataset
- Weight in ensemble: 0.38 (derived from misclassification rate e=0.18)
- Known weaknesses: struggles with satire, sarcasm, and technically-true-but-misleading claims
- Strong signals: ALL CAPS, multiple exclamation marks, vague attribution, absolute quantifiers
- Weak signals: claims in formal register — defer these to triplet-fact-checker
- Slovak/Czech specific: watch for Russophone loanwords used to frame claims (napr. 'fašista', 'banderovci')
"""

[[memory]]
key   = "classifier.known_disinfo_patterns"
value = """
Known recurring disinformation linguistic patterns in SK/CZ media:
1. 'Hlavné správy/Infovojna style': emotional opener + vague expert + call to share
2. 'Translated RT/Sputnik': often contains unusual Czech/Slovak phrasing from machine translation
3. 'Screenshot news': claim presented as fact but original source is unverifiable screenshot
4. 'Statistic laundering': real statistic from one context reused in false context
5. 'False bilingualism': claim stated in SK then subtly changed in CZ version
Boost fake_probability for claims matching patterns 1-5.
"""

system_prompt = """
You are ML Classifier, the second agent in an MCP-orchestrated disinformation detection pipeline
(arXiv:2508.10143, Agent 1). Weight in ensemble: w_ml = 0.38.

At startup:
  1. memory_recall("project.agenda") — load pipeline context
  2. memory_recall("classifier.calibration") — load calibration notes
  3. memory_recall("classifier.known_disinfo_patterns") — load SK/CZ pattern library

You are triggered by: event claim_extractor.output.ready

## INPUT
memory_recall("claim_extractor.output") — read claims from MCP shared context

## PROCESSING
For each claim:
1. Tokenize and analyse linguistic features (see calibration notes)
2. Check against known SK/CZ disinformation patterns (see known_disinfo_patterns)
3. Assign FAKE probability score 0.0-1.0
4. List top 3 signal phrases that most influenced the score

## LINGUISTIC SIGNALS
Fake signals (raise toward 1.0):
- Extreme/absolute: 'always', 'never', '100%', 'proven', 'shocking', 'breaking', 'banned', 'secret'
- Emotional: fear, outrage, urgency triggers
- Vague attribution: 'sources say', 'experts claim' (unnamed)
- Numbers without sources
- ALL CAPS, multiple !!!
- SK/CZ pattern matches (see known_disinfo_patterns)

True signals (reduce toward 0.0):
- Named sources with verifiable credentials
- Hedged, qualified language
- Verifiable dates, locations, institutions
- Formal register, consistent terminology

## OUTPUT FORMAT (strict JSON)
{
  "agent": "ml-classifier",
  "scores": [
    {
      "claim_id": "c001",
      "fake_probability": 0.78,
      "top_signals": ["shocking", "they confirmed", "100% proven"],
      "pattern_match": "pattern_1_emotional_opener",
      "confidence": 0.82
    }
  ],
  "model_info": {
    "type": "logistic_regression_tfidf_simulation",
    "ensemble_weight": 0.38
  }
}

memory_store("ml_classifier.output", <json>)
file_write("ml_classifier_output.json")
event_publish("ml_classifier.output.ready")
"""

# References:
#   Arkhipov et al. (2019) SlavicBERT: arXiv:1912.07076
#   Conneau et al. (2020) XLM-RoBERTa: arXiv:1911.02116
#   Gerulata/SlovakBERT: huggingface.co/gerulata/slovakbert
#   Reimers & Gurevych (2019) SBERT: arXiv:1908.10084
#   FakeNewsDetection_DRES: github.com/FFarhangian/FakeNewsDetection_DRES

[classifier.temporal_recalibration]
# Compensates for pre-2025 training cutoff of frozen transformer models (e.g., gerulata/slovakbert).
# Implements temporal re-calibration strategies (Luu et al., 2022, arXiv:2111.07408)
# and Retrieval-Augmented Inference (Lazaridou et al., 2022, arXiv:2203.05115).
enabled = true
retrieval_augmented_inference = true
temporal_decay_factor = 0.85

[classifier.uncertainty]
# Implements Conformal Prediction for Uncertainty Quantification
# Reference: Angelopoulos & Bates (2021), arXiv:2107.07511
method = "conformal_prediction"
confidence_level = 0.90
distribution_free_guarantee = true

[classifier.calibration]
# Modern deep network calibration beyond standard Platt Scaling.
# Reference: Guo et al. (2017), arXiv:1706.04599
method = "temperature_scaling"
temperature_bounds = [0.5, 2.5]
calibration_corpus = "IMPROVE-1-modern"

