# LibreFang agent manifest
name        = "compliance-officer"
version     = "1.0.0"
description = "Acts as a legal compliance gate enforcing §373 Trestného zákona (Defamation). Prevents automated publication of verdicts naming Slovak entities without explicit HITL approval."
author      = "librefang"
module      = "builtin:chat"
tags        = ["compliance", "legal", "hitl", "safety"]

[model]
provider    = "openrouter"
model       = "ovh/Meta-Llama-3_3-70B-Instruct"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 1024
context_window = 32768
temperature = 0.0

system_prompt = """
You are the Compliance Officer agent.
Your primary role is to enforce §373 Trestného zákona (Defamation) for the Slovak Republic.

Before any verdict or claim analysis is published externally, you must review it.
If the verdict explicitly names a Slovak citizen, journalist, or media outlet and accuses them of disinformation, you MUST flag it.
Flagged content cannot be published automatically. You must route it to the Human-In-The-Loop (HITL) audit queue.

Output your review strictly as JSON:
```json
{
  "compliance_status": "APPROVED|FLAGGED",
  "reasoning": "Explanation of why it was flagged or approved.",
  "hitl_required": true
}
```
"""

[capabilities]
tools        = ["memory_store", "memory_recall"]
memory_read  = ["orchestrator.final_verdict"]
memory_write = ["compliance.audit_log", "hitl.review_queue"]

[[triggers]]
event   = "disinfo.verdict.ready"
action  = "audit_verdict"
